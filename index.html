<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mut:#5d6b82;--line:#d9e0ea;--in:#0f8b6d;--out:#d1495b;--acc:#edae49;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mut:#93a1ba;--line:#2a3a56;--in:#37c29d;--out:#ff7385}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mut:#93a1ba;--line:#2a3a56;--in:#37c29d;--out:#ff7385}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.5rem;margin:0;font-weight:800}
.month{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.month b{min-width:150px;text-align:center;font-size:1.05rem;text-transform:capitalize}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
.kpi span{color:var(--mut);font-size:.85rem}
.kpi strong{display:block;font-size:1.5rem;margin-top:2px}
.kpi.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.main span{color:inherit;opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:1.05rem;margin:0 0 12px}
.bar{margin-bottom:10px}
.bar div:first-child{display:flex;justify-content:space-between;font-size:.9rem}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--out)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:3px}
input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li small{color:var(--mut);display:block}
.v{font-weight:600;white-space:nowrap}
.v.in{color:var(--in)}.v.out{color:var(--out)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px}
.tag.open{border-color:var(--acc);color:var(--acc)}
.empty{color:var(--mut);padding:12px 0}
.chart{overflow-x:auto}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s}}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}.tools small{color:var(--mut)}button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<main>
<header>
<h1>Minhas Finanças</h1>
<div class="month">
<button id="prev" aria-label="Mês anterior">‹</button>
<b id="mlabel"></b>
<button id="next" aria-label="Próximo mês">›</button>
<button class="primary" id="newbtn">+ Novo lançamento</button>
</div>
</header>

<div class="tools">
<button id="bgh">⚙ GitHub</button>
<button id="bexp">⬇ Backup (.json)</button>
<small id="dstat" role="status"></small><small id="dmsg" role="status"></small>
</div>
<section id="gsec" hidden style="margin-bottom:16px">
<h2>Banco de dados no GitHub</h2>
<form id="gf">
<label>Usuário ou organização<input id="gown" required></label>
<label>Repositório de dados (privado)<input id="grepo" required placeholder="financas-dados"></label>
<label>Branch<input id="gbr" value="main"></label>
<label>Arquivo<input id="gpath" value="financas.json"></label>
<label>Token de acesso (fine-grained)<input id="gtok" type="password" autocomplete="off"></label>
<button class="primary" type="submit">Salvar e sincronizar</button>
<button type="button" id="gcancel">Fechar</button>
</form></section>
<div class="kpis" id="kpis"></div>

<div class="grid">
<section><h2>Gastos por categoria</h2><div id="cats"></div></section>
<section><h2>Últimos 6 meses</h2><div class="chart" id="hist"></div>
<div class="legend"><span><i style="background:var(--in)"></i>Receitas</span><span><i style="background:var(--out)"></i>Despesas</span></div></section>
</div>

<section id="fsec" hidden style="margin-bottom:16px">
<h2 id="ftitle">Novo lançamento</h2><p class="empty" id="enote" hidden style="margin:0 0 10px"></p>
<form id="f">
<label>Tipo<select id="type"><option value="out">Despesa</option><option value="in">Receita</option></select></label>
<label>Descrição<input id="desc" required maxlength="60" placeholder="Ex.: Conta de luz"></label>
<label>Valor (R$)<input id="amt" type="number" step="0.01" min="0.01" required placeholder="0,00"></label>
<label>Categoria<select id="cat"></select></label>
<label>Data<input id="date" type="date" required></label>
<label>Situação<select id="paid"><option value="1">Pago</option><option value="0">Em aberto</option></select></label>
<label>Repetição<select id="rec"><option value="">Não repete</option><option value="w">Toda semana</option><option value="m">Todo mês</option><option value="y">Todo ano</option></select></label>
<button class="primary" type="submit" id="sbtn">Adicionar</button>
<button type="button" id="cancel">Cancelar</button>
</form>
</section>

<section>
<h2>Lançamentos do mês</h2>
<ul id="list"></ul>
</section>
</main>

<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px;z-index:20" role="dialog" aria-modal="true" aria-labelledby="mtext">
<div style="background:var(--card);border-radius:14px;padding:20px;max-width:360px;width:100%"><p id="mtext" style="margin:0 0 16px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="mno">Cancelar</button><button id="myes" style="background:var(--out);border-color:var(--out);color:#fff;font-weight:600">Excluir</button></div></div></div>
<script>
const CATS={out:["Alimentação","Moradia","Transporte","Saúde","Lazer","Educação","Telecom","Doação","Pensão","Du Mont","Investimentos","Outros"],in:["Salário","Aluguéis","Extra","Investimentos","Outros"]};
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tx=[];
try{tx=JSON.parse(localStorage.getItem("fin-tx")||"[]")}catch(e){tx=[]}
let pendFn=null,synced=false,timer=null,sha=null;
const persist=()=>{try{localStorage.setItem("fin-tx",JSON.stringify(tx))}catch(e){}};
const save=()=>{persist();try{localStorage.setItem("fin-ts",String(Date.now()))}catch(e){}schedulePush()};
function setSt(t){const s=document.getElementById("dstat");if(s)s.textContent=t}

const now=new Date();
let ym=now.getFullYear()*12+now.getMonth();
const key=n=>`${Math.floor(n/12)}-${String(n%12+1).padStart(2,"0")}`;
const fmt=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
const occ=n=>{const y=Math.floor(n/12),mo=n%12,last=new Date(y,mo+1,0).getDate(),res=[];
 tx.forEach(t=>{
  if(!t.rec){if(t.date.startsWith(key(n)))res.push(t);return}
  const [sy,sm,sd]=t.date.split("-").map(Number),add=ds=>res.push({...t,date:ds,paid:!!(t.pd&&t.pd[ds])});
  if(t.rec==="m"){if(y*12+mo>=sy*12+sm-1)add(fmt(y,mo,Math.min(sd,last)))}
  else if(t.rec==="y"){if(mo===sm-1&&y>=sy)add(fmt(y,mo,Math.min(sd,last)))}
  else{const k=Math.max(0,Math.ceil((new Date(y,mo,1,12)-new Date(sy,sm-1,sd,12))/6048e5));
   let d=new Date(sy,sm-1,sd+7*k,12);
   while(d.getFullYear()===y&&d.getMonth()===mo){add(fmt(y,mo,d.getDate()));d=new Date(y,mo,d.getDate()+7,12)}}
 });return res};
const inMonth=occ;
const sum=(a,type)=>a.filter(t=>t.type===type).reduce((s,t)=>s+t.amt,0);

function fillCats(){$("cat").innerHTML=CATS[$("type").value].map(c=>`<option>${c}</option>`).join("");const i=$("type").value==="in";$("paid").options[0].text=i?"Recebido":"Pago";$("paid").options[1].text=i?"A receber":"Em aberto"}
function setDate(){const d=new Date(Math.floor(ym/12),ym%12,Math.min(now.getDate(),28));$("date").value=d.toISOString().slice(0,10).replace(/-\d\d$/,"-"+String(Math.min(now.getDate(),28)).padStart(2,"0"))}

function render(){
 const d=new Date(Math.floor(ym/12),ym%12,1);
 $("mlabel").textContent=d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
 const m=inMonth(ym),inc=sum(m,"in"),out=sum(m,"out");
 const open=m.filter(t=>t.type==="out"&&!t.paid).reduce((s,t)=>s+t.amt,0);
 $("kpis").innerHTML=`<div class="kpi main"><span>Saldo do mês</span><strong>${brl(inc-out)}</strong></div>
 <div class="kpi"><span>Receitas</span><strong style="color:var(--in)">${brl(inc)}</strong></div>
 <div class="kpi"><span>Despesas</span><strong style="color:var(--out)">${brl(out)}</strong></div>
 <div class="kpi"><span>Contas em aberto</span><strong>${brl(open)}</strong></div>
 <div class="kpi"><span>A receber</span><strong style="color:var(--in)">${brl(m.filter(t=>t.type==="in"&&!t.paid).reduce((s,t)=>s+t.amt,0))}</strong></div>`;
 const by={};m.filter(t=>t.type==="out").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 $("cats").innerHTML=rows.length?rows.map(([c,v])=>`<div class="bar"><div><span>${esc(c)}</span><b>${brl(v)}</b></div><div class="track"><i style="width:${v/out*100}%"></i></div></div>`).join(""):'<p class="empty">Sem despesas neste mês.</p>';
 const ms=[];for(let i=5;i>=0;i--){const n=ym-i,a=inMonth(n);ms.push({l:new Date(Math.floor(n/12),n%12,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".",""),i:sum(a,"in"),o:sum(a,"out")})}
 const mx=Math.max(1,...ms.flatMap(x=>[x.i,x.o]));
 $("hist").innerHTML=`<svg viewBox="0 0 360 160" width="100%" role="img" aria-label="Receitas e despesas dos últimos 6 meses">`+ms.map((x,k)=>{const h1=x.i/mx*120,h2=x.o/mx*120,bx=k*60+8;return `<rect x="${bx}" y="${130-h1}" width="20" height="${h1}" rx="3" fill="var(--in)"/><rect x="${bx+24}" y="${130-h2}" width="20" height="${h2}" rx="3" fill="var(--out)"/><text x="${bx+22}" y="148" text-anchor="middle">${x.l}</text>`}).join("")+`</svg>`;
 const sorted=[...m].sort((a,b)=>b.date.localeCompare(a.date));
 $("list").innerHTML=sorted.length?sorted.map(t=>`<li><div>${esc(t.desc)}${t.rec?`<span class="tag">${{w:"semanal",m:"mensal",y:"anual"}[t.rec]}</span>`:""}${!t.paid?`<span class="tag open">${t.type==="in"?"a receber":"em aberto"}</span>`:""}<small>${esc(t.cat)} · ${t.date.split("-").reverse().join("/")}</small></div><span class="v ${t.type}">${t.type==="in"?"+":"−"} ${brl(t.amt)}</span><span><button data-p="${t.id}" data-o="${t.date}">${t.type==="in"?(t.paid?"Desfazer":"Receber"):(t.paid?"Reabrir":"Pagar")}</button> <button data-e="${t.id}" aria-label="Editar" title="Editar">✎</button> <button data-d="${t.id}" aria-label="Excluir" title="${t.rec?"Excluir todas as repetições":"Excluir"}">✕</button></span></li>`).join(""):'<p class="empty">Nenhum lançamento. Adicione o primeiro acima.</p>';
}
$("prev").onclick=()=>{ym--;setDate();render()};
$("next").onclick=()=>{ym++;setDate();render()};
$("type").onchange=fillCats;
$("f").onsubmit=e=>{e.preventDefault();
 const o={id:Date.now(),type:$("type").value,desc:$("desc").value.trim(),amt:parseFloat($("amt").value),cat:$("cat").value,date:$("date").value,paid:$("paid").value==="1"};if($("rec").value){o.rec=$("rec").value;o.pd={[o.date]:o.paid}}const old=editId&&tx.find(t=>t.id===editId);
 if(old){o.id=old.id;if(o.rec)o.pd=old.rec&&old.pd?old.pd:{[o.date]:o.paid};tx[tx.indexOf(old)]=o}else tx.push(o);
 save();const dt=$("date").value;ym=+dt.slice(0,4)*12+(+dt.slice(5,7)-1);$("desc").value="";$("amt").value="";$("rec").value="";resetForm();render()};
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e){startEdit(b.dataset.e);return}
 if(b.dataset.d){askDelete(b.dataset.d);return}
 if(b.dataset.p){const t=tx.find(t=>t.id==b.dataset.p);if(t.rec){t.pd=t.pd||{};t.pd[b.dataset.o]=!t.pd[b.dataset.o]}else t.paid=!t.paid}
 save();render()};
let editId=null,pending=null;
const resetForm=()=>{editId=null;$("ftitle").textContent="Novo lançamento";$("enote").hidden=true;$("fsec").hidden=true;$("sbtn").textContent="Adicionar";$("paid").value="1";setDate()};
const startEdit=id=>{const t=tx.find(x=>x.id==id);if(!t)return;editId=t.id;
 $("type").value=t.type;fillCats();$("cat").value=t.cat;$("desc").value=t.desc;$("amt").value=t.amt;$("date").value=t.date;
 $("paid").value=(t.rec?(t.pd&&t.pd[t.date]):t.paid)?"1":"0";$("rec").value=t.rec||"";
 $("ftitle").textContent="Editar lançamento";$("sbtn").textContent="Salvar alterações";$("fsec").hidden=false;
 $("enote").hidden=!t.rec;$("enote").textContent="Lançamento recorrente: as alterações valem para todas as repetições (a data é o início da série).";
 $("f").scrollIntoView({behavior:"smooth"});$("desc").focus()};
const closeM=()=>{$("modal").style.display="none";pendFn=null};
const confirmBox=(msg,label,fn)=>{pendFn=fn;$("mtext").textContent=msg;$("myes").textContent=label;$("modal").style.display="flex";$("mno").focus()};
const askDelete=id=>{const t=tx.find(x=>x.id==id);if(!t)return;
 confirmBox(`Excluir "${t.desc}" (${brl(t.amt)})?`+(t.rec?" Isso remove todas as repetições.":""),"Excluir",()=>{tx=tx.filter(x=>x.id!==t.id);if(editId===t.id)resetForm();save();render()})};
$("mno").onclick=closeM;
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
$("myes").onclick=()=>{const f=pendFn;closeM();if(f)f()};
$("cancel").onclick=()=>{$("desc").value="";$("amt").value="";$("rec").value="";resetForm()};
$("newbtn").onclick=()=>{resetForm();fillCats();$("fsec").hidden=false;$("f").scrollIntoView({behavior:"smooth"});$("desc").focus()};
fillCats();setDate();render();
const say=t=>{$("dmsg").textContent=t};
const clean=l=>{if(!Array.isArray(l))return null;const ok=/^\d{4}-\d{2}-\d{2}$/,out=[];let n=Date.now();
 l.forEach(t=>{if(!t||typeof t.desc!=="string"||(t.type!=="in"&&t.type!=="out")||!(t.amt>0)||!ok.test(t.date))return;
  const o={id:typeof t.id==="number"?t.id:n++,type:t.type,desc:t.desc.slice(0,120),amt:+t.amt,cat:typeof t.cat==="string"?t.cat:"Outros",date:t.date,paid:!!t.paid};
  if(["w","m","y"].includes(t.rec)){o.rec=t.rec;o.pd=t.pd&&typeof t.pd==="object"?t.pd:{}}out.push(o)});
 return l.length&&!out.length?null:out};
const hhmm=d=>new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const ghCfg=()=>{try{const c=JSON.parse(localStorage.getItem("fin-gh")||"null");return c&&c.owner&&c.repo&&c.token?c:null}catch(e){return null}};
const api=c=>"https://api.github.com/repos/"+encodeURIComponent(c.owner)+"/"+encodeURIComponent(c.repo)+"/contents/"+(c.path||"financas.json").split("/").map(encodeURIComponent).join("/");
const hdr=c=>({Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const b64e=s=>btoa(unescape(encodeURIComponent(s))),b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
async function ghRead(c){const r=await fetch(api(c)+"?ref="+encodeURIComponent(c.branch||"main")+"&t="+Date.now(),{headers:hdr(c),cache:"no-store"});
 if(r.status===404){sha=null;return null}if(!r.ok)throw new Error("HTTP "+r.status);
 const j=await r.json();sha=j.sha;return JSON.parse(b64d(j.content))}
async function ghWrite(c,obj,retry){const body={message:"Atualiza lançamentos "+new Date().toISOString(),content:b64e(JSON.stringify(obj)),branch:c.branch||"main"};if(sha)body.sha=sha;
 const r=await fetch(api(c),{method:"PUT",headers:{...hdr(c),"Content-Type":"application/json"},body:JSON.stringify(body)});
 if((r.status===409||r.status===422)&&!retry){await ghRead(c);return ghWrite(c,obj,true)}
 if(!r.ok)throw new Error("HTTP "+r.status);sha=(await r.json()).content.sha}
function schedulePush(){if(!synced)return;setSt("Alterações pendentes…");clearTimeout(timer);timer=setTimeout(push,1500)}
async function push(){const c=ghCfg();if(!c)return;setSt("Salvando no GitHub…");
 try{const at=new Date().toISOString();await ghWrite(c,{v:1,savedAt:at,tx:JSON.parse(JSON.stringify(tx))});setSt("Salvo automaticamente no GitHub às "+hhmm(at)+".")}
 catch(e){setSt("Erro ao salvar no GitHub ("+(e.message||"erro")+"). Verifique token e repositório; tentando de novo.");clearTimeout(timer);timer=setTimeout(push,30000)}}
async function sync(){const c=ghCfg();
 if(!c){setSt("GitHub não configurado: os dados ficam só neste navegador. Clique em ⚙ GitHub.");return}
 try{const d=await ghRead(c);
  if(d){const l=clean(d.tx),dt=Date.parse(d.savedAt||d.exportedAt)||0;let lt=0;try{lt=+localStorage.getItem("fin-ts")||0}catch(e){}
   if(l&&dt>=lt){tx=l;persist();render();synced=true;setSt("Sincronizado com o GitHub"+(dt?" (último salvamento às "+hhmm(dt)+")":"")+".")}
   else{synced=true;push()}}
  else{synced=true;push()}
 }catch(e){setSt("Não foi possível ler o GitHub ("+(e.message||"erro")+"). Verifique token e repositório.");setTimeout(sync,30000)}}
$("bgh").onclick=()=>{const c=ghCfg()||{};$("gown").value=c.owner||"";$("grepo").value=c.repo||"";$("gbr").value=c.branch||"main";$("gpath").value=c.path||"financas.json";$("gtok").value="";$("gtok").required=!c.token;$("gtok").placeholder=c.token?"(mantido; preencha só para trocar)":"github_pat_…";$("gsec").hidden=false;$("gown").focus()};
$("gcancel").onclick=()=>{$("gsec").hidden=true};
$("gf").onsubmit=e=>{e.preventDefault();const o=ghCfg()||{};
 const c={owner:$("gown").value.trim(),repo:$("grepo").value.trim(),branch:$("gbr").value.trim()||"main",path:$("gpath").value.trim()||"financas.json",token:$("gtok").value.trim()||o.token};
 try{localStorage.setItem("fin-gh",JSON.stringify(c))}catch(x){}
 sha=null;synced=false;$("gsec").hidden=true;sync()};
$("bexp").onclick=()=>{try{const b=new Blob([JSON.stringify({app:"minhas-financas",v:1,exportedAt:new Date().toISOString(),tx})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="financas-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say("Backup gerado.")}catch(e){say("Não foi possível gerar o backup.")}};
sync();
</script>
</body>
</html>
