<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mut:#5d6b82;--line:#d9e0ea;--in:#0f8b6d;--out:#d1495b;--acc:#edae49;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mut:#93a1ba;--line:#2a3a56;--in:#37c29d;--out:#ff7385}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mut:#93a1ba;--line:#2a3a56;--in:#37c29d;--out:#ff7385}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:1.5rem;margin:0;font-weight:800}
.month{display:flex;align-items:center;gap:8px}
.month b{min-width:150px;text-align:center;font-size:1.05rem;text-transform:capitalize}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line)}
.kpi span{color:var(--mut);font-size:.85rem}
.kpi strong{display:block;font-size:1.5rem;margin-top:2px}
.kpi.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.main span{color:inherit;opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{font-size:1.05rem;margin:0 0 12px}
.bar{margin-bottom:10px}
.bar div:first-child{display:flex;justify-content:space-between;font-size:.9rem}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.track i{display:block;height:100%;background:var(--out)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:3px}
input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li small{color:var(--mut);display:block}
.v{font-weight:600;white-space:nowrap}
.v.in{color:var(--in)}.v.out{color:var(--out)}
.tag{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px}
.tag.open{border-color:var(--acc);color:var(--acc)}
.empty{color:var(--mut);padding:12px 0}
.chart{overflow-x:auto}
svg text{fill:var(--mut);font-size:11px;font-family:inherit}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
@media (prefers-reduced-motion:no-preference){.track i{transition:width .4s}}
</style>
</head>
<body>
<main>
<header>
<h1>Minhas Finanças</h1>
<div class="month">
<button id="prev" aria-label="Mês anterior">‹</button>
<b id="mlabel"></b>
<button id="next" aria-label="Próximo mês">›</button>
</div>
</header>

<div class="kpis" id="kpis"></div>

<div class="grid">
<section><h2>Gastos por categoria</h2><div id="cats"></div></section>
<section><h2>Últimos 6 meses</h2><div class="chart" id="hist"></div>
<div class="legend"><span><i style="background:var(--in)"></i>Receitas</span><span><i style="background:var(--out)"></i>Despesas</span></div></section>
</div>

<section style="margin-bottom:16px">
<h2 id="ftitle">Novo lançamento</h2><p class="empty" id="enote" hidden style="margin:0 0 10px"></p>
<form id="f">
<label>Tipo<select id="type"><option value="out">Despesa</option><option value="in">Receita</option></select></label>
<label>Descrição<input id="desc" required maxlength="60" placeholder="Ex.: Conta de luz"></label>
<label>Valor (R$)<input id="amt" type="number" step="0.01" min="0.01" required placeholder="0,00"></label>
<label>Categoria<select id="cat"></select></label>
<label>Data<input id="date" type="date" required></label>
<label>Situação<select id="paid"><option value="1">Pago</option><option value="0">Em aberto</option></select></label>
<label>Repetição<select id="rec"><option value="">Não repete</option><option value="w">Toda semana</option><option value="m">Todo mês</option><option value="y">Todo ano</option></select></label>
<button class="primary" type="submit" id="sbtn">Adicionar</button>
<button type="button" id="cancel" hidden>Cancelar</button>
</form>
</section>

<section>
<h2>Lançamentos do mês</h2>
<ul id="list"></ul>
</section>
</main>

 const o={id:Date.now(),type:$("type").value,desc:$("desc").value.trim(),amt:parseFloat($("amt").value),cat:$("cat").value,date:$("date").value,paid:$("type").value==="in"||$("paid").value==="1"};if($("rec").value){o.rec=$("rec").value;o.pd={[o.date]:o.paid}}const old=editId&&tx.find(t=>t.id===editId);
 if(old){o.id=old.id;if(o.rec)o.pd=old.rec&&old.pd?old.pd:{[o.date]:o.paid};tx[tx.indexOf(old)]=o}else tx.push(o);
 save();const dt=$("date").value;ym=+dt.slice(0,4)*12+(+dt.slice(5,7)-1);$("desc").value="";$("amt").value="";$("rec").value="";resetForm();render()};
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.e){startEdit(b.dataset.e);return}
 if(b.dataset.d){askDelete(b.dataset.d);return}
 if(b.dataset.p){const t=tx.find(t=>t.id==b.dataset.p);if(t.rec){t.pd=t.pd||{};t.pd[b.dataset.o]=!t.pd[b.dataset.o]}else t.paid=!t.paid}
 save();render()};
let editId=null,pending=null;
const resetForm=()=>{editId=null;$("ftitle").textContent="Novo lançamento";$("enote").hidden=true;$("cancel").hidden=true;$("sbtn").textContent="Adicionar";$("paid").value="1";setDate()};
const startEdit=id=>{const t=tx.find(x=>x.id==id);if(!t)return;editId=t.id;
 $("type").value=t.type;fillCats();$("cat").value=t.cat;$("desc").value=t.desc;$("amt").value=t.amt;$("date").value=t.date;
 $("paid").value=(t.rec?(t.pd&&t.pd[t.date]):t.paid)?"1":"0";$("rec").value=t.rec||"";
 $("ftitle").textContent="Editar lançamento";$("sbtn").textContent="Salvar alterações";$("cancel").hidden=false;
 $("enote").hidden=!t.rec;$("enote").textContent="Lançamento recorrente: as alterações valem para todas as repetições (a data é o início da série).";
 $("f").scrollIntoView({behavior:"smooth"});$("desc").focus()};
const closeM=()=>{$("modal").style.display="none";pending=null};
const askDelete=id=>{const t=tx.find(x=>x.id==id);if(!t)return;pending=t.id;
 $("mtext").textContent=`Excluir "${t.desc}" (${brl(t.amt)})?`+(t.rec?" Isso remove todas as repetições.":"");
 $("modal").style.display="flex";$("mno").focus()};
$("mno").onclick=closeM;
$("modal").onclick=e=>{if(e.target.id==="modal")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
$("myes").onclick=()=>{tx=tx.filter(t=>t.id!==pending);if(editId===pending)resetForm();save();closeM();render()};
$("cancel").onclick=()=>{$("desc").value="";$("amt").value="";$("rec").value="";resetForm()};
fillCats();setDate();render();
</script>
</body>
